name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jev:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PI_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run check
