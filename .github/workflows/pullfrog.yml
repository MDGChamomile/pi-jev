name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}

# Manual-dispatch plumbing only. Owner-approved automatic PR reviews and
# post-push re-reviews are configured separately in the Pullfrog console;
# keep non-review automations OFF. See .github/PULLFROG.md.
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run review agent
        # v0 resolved on 2026-09-27; this pins the entrypoint, not all runtime code.
        uses: pullfrog/pullfrog@99c5e781dd54463197d1109998386d37c84f6853
        with:
          prompt: ${{ inputs.prompt }}
          push: disabled
          shell: restricted
          timeout: 15m
        # Model access is configured separately; do not forward repository secrets.
